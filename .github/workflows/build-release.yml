name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@v1

    - name: Install dependencies
      run: |
        uv sync

    - name: Install Playwright browsers
      run: |
        uv run playwright install chromium

    - name: Copy downloaded Playwright browsers into the repo (will be bundled)
      run: |
        # Copy the ms-playwright cache (where Playwright downloaded Chromium) into the workspace
        # This directory will be added to the executable with PyInstaller (--add-data).
        # $env:LOCALAPPDATA resolves to C:\Users\runneradmin\AppData\Local on the runner.
        if (Test-Path "$env:LOCALAPPDATA\ms-playwright") {
          Remove-Item -Path ".\ms-playwright" -Recurse -Force -ErrorAction SilentlyContinue || $null
          Copy-Item -Path "$env:LOCALAPPDATA\ms-playwright" -Destination "$PWD\ms-playwright" -Recurse -Force
          Write-Host "ms-playwright copied to $PWD\ms-playwright"
          Get-ChildItem ".\ms-playwright" -Depth 1 | Select-Object Name,FullName
        } else {
          Write-Error "ms-playwright not found at $env:LOCALAPPDATA\ms-playwright"
          exit 1
        }

    - name: Install PyInstaller
      run: |
        uv add pyinstaller

    - name: Build executable
      run: |
        uv run pyinstaller --onefile --add-data "ms-playwright;ms-playwright" --collect-all=flask --collect-all=playwright --hidden-import=webview --hidden-import=webview.platforms.winforms --hidden-import=clr --hidden-import=pythonnet --hidden-import=lxml --hidden-import=requests --hidden-import=urllib3 --name=pahe-downloader-playwright --clean --noconsole --icon=static/icon.ico main.py

    - name: Verify executable exists
      run: |
        if (Test-Path "dist\pahe-downloader-playwright.exe") {
          Write-Host "Executable created successfully"
          Get-Item "dist\pahe-downloader-playwright.exe" | Select-Object Name, Length
        } else {
          Write-Error "Executable not found!"
          exit 1
        }

    - name: Generate checksum
      run: |
        $hash = Get-FileHash -Path "dist\pahe-downloader-playwright.exe" -Algorithm SHA256
        "$($hash.Hash)  pahe-downloader-playwright.exe" | Out-File -FilePath "dist\pahe-downloader-playwright.exe.sha256" -Encoding ASCII
        Get-Content "dist\pahe-downloader-playwright.exe.sha256"

    - name: Upload executable and checksum to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/pahe-downloader-playwright.exe
          dist/pahe-downloader-playwright.exe.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}